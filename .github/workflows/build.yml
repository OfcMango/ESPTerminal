name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -e

          APP_BUILD_FILE="$(find . -type f -path '*/app/build.gradle.kts' -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$APP_BUILD_FILE" ]; then
            echo "ERROR: Cannot find app/build.gradle.kts"
            echo "Check that you uploaded the extracted Android project."
            exit 1
          fi

          PROJECT_DIR="${APP_BUILD_FILE%/app/build.gradle.kts}"

          echo "Android project directory: $PROJECT_DIR"

          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESPTerminal-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
